plugins {
    id 'com.android.application'
}

android {
    namespace 'com.evoworld.uckitkatwebview'
    compileSdk 33

    defaultConfig {
        applicationId "com.evoworld.uckitkatwebview"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}