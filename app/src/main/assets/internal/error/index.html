<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  background-color: #000000;
  color: #bebebe;
  font-family: "Roboto", "Droid Sans", sans-serif;
  font-size: 14px;
  line-height: 1.4;
}
.wrap {
  padding: 20px 16px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
h1 {
  font-size: 20px;
  font-weight: normal;
  color: #ff4444;
  margin-top: 0;
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid #333333;
  padding-bottom: 10px;
}
code {
  display: block;
  font-family: monospace;
  font-size: 12px;
  color: #ffffff;
  background-color: #1a1a1a;
  padding: 8px 10px;
  border: 1px solid #2d2d2d;
  margin-bottom: 16px;
  word-wrap: break-word;
}
p {
  margin-top: 0;
  margin-bottom: 16px;
}
.btn-container {
  margin-top: 24px;
}
.btn {
  display: inline-block;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px 16px;
  margin-right: 8px;
  margin-bottom: 10px;
  text-align: center;
  vertical-align: middle;
  cursor: pointer;
}
.btn.secondary {
  color: #ffffff;
  background-color: #33b5e5;
  border: 1px solid #33b5e5;
}
.btn.secondary:active {
  background-color: #0099cc; /* Holo Blue Dark */
  border: 1px solid #0099cc;
}
.btn.primary {
  color: #ffffff;
  background-color: #222222;
  border: 1px solid #444444;
}
.btn.primary:active {
  background-color: #33b5e5;
  border: 1px solid #33b5e5;
  color: #000000;
}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{TITLE}}</h1>
    <p><code>{{URL}}</code></p>
    <p>{{MESSAGE}}</p>
    <div class="btn-container">
      <a class="btn secondary" href="javascript:history.back()">Back to safety</a>
      <a class="btn primary" href="{{PROCEED_HREF}}">{{PROCEED_LABEL}}</a>
    </div>
  </div>
</body>
</html>
