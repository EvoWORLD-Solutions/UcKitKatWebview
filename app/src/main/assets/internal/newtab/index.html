<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background-color: #000000;
  color: #ffffff;
  font-family: "Roboto", "Droid Sans", sans-serif;
  font-weight: lighter;
}
.wrap {
  display: table;
  width: 100%;
  height: 100%;
  text-align: center;
}
.info {
  display: table-cell;
  vertical-align: middle;
  font-size: 26px;
  color: #33b5e5; /* Holo Blue Light */
  text-transform: uppercase;
  letter-spacing: 2px;
}
.info span {
  border-bottom: 2px solid #33b5e5;
  padding-bottom: 6px;
}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="info"><span>New Tab</span></div>
  </div>
</body>
</html>
